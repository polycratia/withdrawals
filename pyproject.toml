[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "withdrawals"
version = "0.1.0"
description = "Withdrawal pipeline: route internal transfers off-chain, send external ones on-chain, stay idempotent when the callback arrives twice."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "polycratia", email = "hey@polycratia.com" }]
keywords = ["withdrawals", "payments", "idempotency", "blockchain"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/polycratia/withdrawals"
Source = "https://github.com/polycratia/withdrawals"
Issues = "https://github.com/polycratia/withdrawals/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/withdrawals"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]
